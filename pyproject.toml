[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ligandparam"
version = "1.6.1"
description = "A ligand parameterization package for Amber"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Zeke Piskulich", email = "piskulichz@gmail.com"},
  {name = "German P. Barletta"},
  {name = "Timothy J. Giese"},
  {name = "Nate Levinzon", email = "ndlevinzon@gmail.com"},
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]
dependencies = [
  "numpy<2",
  "pandas",
  "requests",
  "MDAnalysis>2.7.0",
  "parmed",
  "rdkit",
  "ase",
  "scipy",
  "matplotlib",
  "networkx>=3.0",
  "pyyaml>=6.0",
]

urls = { "Homepage" = "https://github.com/piskulichz/ligandparam" }

[project.optional-dependencies]

# GFN2-xTB via tblite (lig-dihed-correct --model xtb). Prefer this on HPC.
tblite = [
  "tblite",
]

# DeepMD-assisted recipes (DPLigand / DPFreeLigand). Install TensorFlow
# from conda-forge on HPC - pip wheels are often unavailable there:
#   conda install -c conda-forge tensorflow deepmd-kit
ml = [
  "deepmd-kit",
]

# Optional ffpopt ML potentials (--model mace / ani*).
# Packages and versions vary by CUDA / torch stack; install matching
# wheels for your environment after this meta-extra if needed.
ml-potentials = [
  "mace-torch",
  "torchani",
]

# AIMNet2 neural potential (--model aimnet2). Needs Python 3.11-3.13 and
# PyTorch 2.8+. On CPU HPC: pip install torch --index-url
# https://download.pytorch.org/whl/cpu  then pip install -e ".[aimnet]".
# ASE is already a ligandparam core dep; extra "ase" pulls aimnet's ASE extra.
aimnet = [
  "aimnet[ase]",
]

dihed = [
  # Fragmented twist uses integrated src/ffpopt + src/scission.
  # Still needs AmberTools on PATH and an HL model stack (e.g. xtb/tblite).
  "ndfes",
  "geometric",  # geomeTRIC optimizer used by ffpopt WaveFront scans
]

# Prefer conda-forge JAX on HPC / conda envs (avoids pip ml-dtypes build failures):
#   conda install -c conda-forge "jax>=0.4" "jaxlib>=0.4"
# Pip wheels are fine on many Linux/macOS setups; Windows often needs conda.
jax = [
  "jax>=0.4.30",
  "jaxlib>=0.4.30",
]

misc = [
  "openbabel",
]

sage = [
  "openff-toolkit",
]

docs = [
  "sphinx",
  "sphinx_rtd_theme",
]

all = [
  "ligandparam[tblite]",
  "ligandparam[ml]",
  "ligandparam[ml-potentials]",
  "ligandparam[aimnet]",
  "ligandparam[dihed]",
  "ligandparam[jax]",
  "ligandparam[misc]",
  "ligandparam[sage]",
  "ligandparam[docs]",
]

[project.scripts]
lighfix = "ligandparam.cli.CliLigHFix:lighfix"
lig-getparam = "ligandparam.cli.LigGetParam:main"
lig-dihed-correct = "alps.cli.LigDihedCorrect:main"
lig-scission = "alps.cli.LigScission:main"
scission = "scission.Cli:main"
smiles-to-pdb = "ligandparam.cli.SmilesToPdb:main"
lig-to-sage = "ligandparam.cli.Mol2ToSage:main"
"ffpopt-DihedScan.py" = "ffpopt.Scripts:ffpopt_DihedScan"
"ffpopt-Optimize.py" = "ffpopt.Scripts:ffpopt_Optimize"
"ffpopt-GenDihedFit.py" = "ffpopt.Scripts:ffpopt_GenDihedFit"
"ffpopt-DihedTwistWorkflow.py" = "ffpopt.Scripts:ffpopt_DihedTwistWorkflow"
"ffpopt-DihedWavefront.py" = "ffpopt.Scripts:ffpopt_DihedWavefront"
"ffpopt-PrepareInput.py" = "ffpopt.Scripts:ffpopt_PrepareInput"
"ffpopt-ConfSearch.py" = "ffpopt.Scripts:ffpopt_ConfSearch"
"ffpopt-RespFit.py" = "ffpopt.Scripts:ffpopt_RespFit"
"ffpopt-DeltaRespFit.py" = "ffpopt.Scripts:ffpopt_DeltaRespFit"
"ffpopt-CpeFit.py" = "ffpopt.Scripts:ffpopt_CpeFit"
"ffpopt-xyz2mol2.py" = "ffpopt.Scripts:ffpopt_xyz2mol2"
"ffpopt-NDimWavefront.py" = "ffpopt.Scripts:ffpopt_NDimWavefront"
# Specialty tools (sugar/pucker, JSON, animate): use ``ffpopt-specialty``.
ffpopt-specialty = "ffpopt.Scripts:ffpopt_specialty"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ligandparam*", "ffpopt*", "scission*", "alps*"]
exclude = ["ligandparam.deprecated", "ligandparam.deprecated.*"]

[tool.setuptools.package-data]
ffpopt = ["bin/*.py", "pkgdata/**/*", "GLOSSARY.md", "README.md"]
ligandparam = ["pkgdata/**/*"]
scission = ["README.md"]

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.format]
skip-magic-trailing-comma = true
