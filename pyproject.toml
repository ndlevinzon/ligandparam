[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ligandparam"
version = "1.4.0"
description = "A ligand parameterization package for Amber"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Zeke Piskulich", email = "piskulichz@gmail.com"},
  {name = "German P. Barletta"},
  {name = "Timothy J. Giese"},
  {name = "Nate Levinzon", email = "ndlevinzon@gmail.com"},
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]
dependencies = [
  "numpy<2",
  "pandas",
  "requests",
  "MDAnalysis>2.7.0",
  "parmed",
  "rdkit",
  "ase",
  "scipy",
  "matplotlib",
  "networkx>=3.0",
  "pyyaml>=6.0",
]

urls = { "Homepage" = "https://github.com/piskulichz/ligandparam" }

[project.optional-dependencies]

# GFN2-xTB via tblite (lig-dihed-correct --model xtb). Prefer this on HPC.
tblite = [
  "tblite",
]

# DeepMD-assisted recipes (DPLigand / DPFreeLigand). Install TensorFlow
# from conda-forge on HPC — pip wheels are often unavailable there:
#   conda install -c conda-forge tensorflow deepmd-kit
ml = [
  "deepmd-kit",
]

dihed = [
  # Fragmented twist uses integrated src/ffpopt + src/scission.
  # Still needs AmberTools on PATH and an HL model stack (e.g. xtb/tblite).
  "ndfes",
]

misc = [
  "openbabel",
]

sage = [
  "openff-toolkit",
]

docs = [
  "sphinx",
  "sphinx_rtd_theme",
]

all = [
  "ligandparam[tblite]",
  "ligandparam[ml]",
  "ligandparam[dihed]",
  "ligandparam[misc]",
  "ligandparam[sage]",
  "ligandparam[docs]",
]

[project.scripts]
lighfix = "ligandparam.cli.cli_lighfix:lighfix"
lig-getparam = "ligandparam.cli.ligandparam_getparam:main"
lig-dihed-correct = "ligandparam.cli.lig_dihed_correct:main"
lig-scission = "ligandparam.cli.lig_scission:main"
scission = "scission.cli:main"
smiles-to-pdb = "ligandparam.cli.smiles_to_pdb:main"
lig-to-sage = "ligandparam.cli.mol2_to_sage:main"
"ffpopt-DihedScan.py" = "ffpopt.scripts:ffpopt_DihedScan"
"ffpopt-Optimize.py" = "ffpopt.scripts:ffpopt_Optimize"
"ffpopt-GenDihedFit.py" = "ffpopt.scripts:ffpopt_GenDihedFit"
"ffpopt-DihedTwistWorkflow.py" = "ffpopt.scripts:ffpopt_DihedTwistWorkflow"
"ffpopt-DihedWavefront.py" = "ffpopt.scripts:ffpopt_DihedWavefront"
"ffpopt-PrepareInput.py" = "ffpopt.scripts:ffpopt_PrepareInput"
"ffpopt-ConfSearch.py" = "ffpopt.scripts:ffpopt_ConfSearch"
"ffpopt-RespFit.py" = "ffpopt.scripts:ffpopt_RespFit"
"ffpopt-DeltaRespFit.py" = "ffpopt.scripts:ffpopt_DeltaRespFit"
"ffpopt-CpeFit.py" = "ffpopt.scripts:ffpopt_CpeFit"
"ffpopt-xyz2mol2.py" = "ffpopt.scripts:ffpopt_xyz2mol2"
"ffpopt-DihedTwistAnimate.py" = "ffpopt.scripts:ffpopt_DihedTwistAnimate"
"ffpopt-WavefrontAnimate.py" = "ffpopt.scripts:ffpopt_WavefrontAnimate"
"ffpopt-FindSugarPuckers.py" = "ffpopt.scripts:ffpopt_FindSugarPuckers"
"ffpopt-DeltaPuckerFit.py" = "ffpopt.scripts:ffpopt_DeltaPuckerFit"
"ffpopt-NDimWavefront.py" = "ffpopt.scripts:ffpopt_NDimWavefront"
"ffpopt-Json2Crds.py" = "ffpopt.scripts:ffpopt_Json2Crds"
"ffpopt-JsonJoin.py" = "ffpopt.scripts:ffpopt_JsonJoin"
"ffpopt-JsonSplit.py" = "ffpopt.scripts:ffpopt_JsonSplit"
"ffpopt-Json2Img.py" = "ffpopt.scripts:ffpopt_Json2Img"
"ffpopt-WavefrontToDP.py" = "ffpopt.scripts:ffpopt_WavefrontToDP"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ligandparam*", "ffpopt*", "scission*"]

[tool.setuptools.package-data]
ffpopt = ["bin/*.py", "pkgdata/**/*", "GLOSSARY.md", "README.md"]
scission = ["README.md"]

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.format]
skip-magic-trailing-comma = true
