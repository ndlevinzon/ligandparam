[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scission"
version = "0.2.1"
description = "AMBER-aware torsion fragment generation for ligand scanning workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "networkx>=3.0",
  "numpy>=1.24",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# RDKit also powers the interactive `scission pick-bond` bond picker.
chem = [
  "parmed>=4.2",
  "rdkit>=2023.9.1",
]
dev = [
  "pytest>=8.0",
]
docs = [
  "sphinx>=8.0",
  "myst-parser>=4.0",
]

[project.scripts]
scission = "scission.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
